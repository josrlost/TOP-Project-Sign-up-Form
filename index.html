<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="script/script.js" defer></script>
    <title>Project: Sign-up Form</title>
</head>
<body>
    <header>
        <section id="sectionHeader">
            <div id="divHeader">
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" width="64" height="64" viewBox="0 0 24 24" style="color: rgb(74, 85, 101); opacity: 1; transform: rotate(0deg);"><g fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" d="M3 5h5.43a2 2 0 0 0 1.664-.89l.812-1.22A2 2 0 0 1 12.57 2h4.488a2 2 0 0 1 1.898 1.368L19.5 5M21 5H8"></path><path stroke-linecap="round" d="m19.5 5l-.62 9.906q-.031.49-.061.917M4.5 5l.605 9.897c.154 2.414.232 3.62.874 4.489c.317.429.726.791 1.2 1.063c.96.551 2.244.551 4.814.551H14.5"></path><path d="M20 19a3 3 0 1 0-6 0a3 3 0 0 0 6 0Z"></path></g></svg>
                <h1>Waste Management Services</h1>
            </div>
        </section>
    </header>
    <main>
        <section id="mainSection">
            <article id="introArticle">
                <button id="toggleBtn">Toggle Theme</button>
                <div>
                    <p>
                        This not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.
                    </p><br>
                    <p>You <em>know</em> you want to.</p>
                </div>
            </article>
            <article id="formArticle">
                <p>Let's do this!</p>
                <form>
                    <div class="formDiv">
                        <label for="fname">FIRST NAME</label>
                        <input id="fname" name="fname" type="text" required>
                    </div>
                    <div class="formDiv">
                        <label for="lname">LAST NAME</label>
                        <input id="lname" name="lname" type="text" required>
                    </div>
                    <div class="formDiv">
                        <label for="email">EMAIL</label>
                        <input id="email" name="email" type="email" required>
                    </div class="formDiv">
                    <div class="formDiv">
                        <label for="phone">PHONE NUMBER</label>
                        <input id="phone" name="phone" type="text" required>
                    </div>
                    <div class="formDiv">
                        <label for="pswrd">PASSWORD</label>
                        <input id="pswrd" name="pswrd" type="password" required>
                    </div>
                    <div class="formDiv">
                        <label for="pswrd">CONFIRM PASSWORD</label>
                        <input id="pswrd" name="pswrd" type="password" required>
                    </div>
                </form>
            </article>
            <article id="accCreationArticle">
                <button type="submit">Create account</button>
                <span>Already have an account? <a href="">Log in</a></span>
            </article>
        </section>
    </main>
</body>
</html>
