<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="script/script.js" defer></script>
    <title>Project: Sign-up Form</title>
</head>
<body>
    <header>
        <section id="sectionHeader">
            <div id="divHeader">
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" width="71" height="71" viewBox="0 0 15 15" style="color: var(--color-general-font); opacity: 1; transform: rotate(0deg);"><path fill="currentColor" d="M9.32.77C9.49.6 9.25.4 8.89.4h-.48C7.97.4 7.13.34 6.76.22L6.2.04c-.4-.13-.87.09-.69.32l1.13 1.87h1.97zM13 12.83c-.76-1.25-.97-1.91-1-2.25c-.03-.26-.06-.4-.08-.51c-.02-.12-.04-.21-.06-.46l-.04-.56c-.08-1.2-.19-2.15-.52-2.91c-.3-.69-1.26-1.43-2.04-1.87c-.22-.13-.43-.26-.59-.36l-.9-.01c0 .08-.01.16-.05.24L6.88 5.8l-.99-.49l.7-1.42h-.22c-.17.12-.43.27-.7.44c-.79.45-1.68 1.16-1.97 1.82c-.34.75-.44 1.7-.53 2.91l-.03.56c-.02.24-.04.33-.07.45c-.02.12-.04.25-.07.52c-.04.33-.25.99-1.01 2.25c-.26.42-.31.91-.14 1.32c.21.52.67.84 1.2.84h8.9c.53 0 .99-.32 1.2-.84c.17-.4.12-.9-.14-1.32z"></path></svg>
                <h1>Waste Management Services</h1>
            </div>
            <p>Photo by <a href="https://unsplash.com/@possessedphotography?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Franck V.</a> on <a href="https://unsplash.com/photos/white-and-green-plastic-bags-JG80MshfiHo?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
        </section>
    </header>
    <main>
        <article id="introArticle">
            <button id="toggleBtn">Toggle Theme</button>
            <div id="introDiv">
                <p>
                    This not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.
                </p><br>
                <p>You <em>know</em> you want to.</p>
            </div>
        </article>
        <article id="formArticle">
            <div>
                <p>Let's do this!</p>
                <form>
                    <div id="fnameDiv">
                        <label for="fname">FIRST NAME:*</label>
                        <input id="fname" name="fname" type="text" required minlength="5" maxlength="10" placeholder="John">
                    </div>
                    <div id="lnameDiv">
                        <label for="lname">LAST NAME:*</label>
                        <input id="lname" name="lname" type="text" required minlength="5" maxlength="10" placeholder="Doe">
                    </div>
                    <div id="emailDiv">
                        <label for="email">EMAIL:*</label>
                        <input id="email" name="email" type="email" required placeholder="johndoe@email.example">
                    </div>
                    <div id="phoneDiv">
                        <label for="phone">PHONE NUMBER:*</label>
                        <input id="phone" name="phone" type="text" required minlength="10" maxlength="11" placeholder="1234567890" pattern="[0-9]">
                    </div>
                    <div id="pswrdDiv">
                        <label for="pswrd">PASSWORD:*</label>
                        <input id="pswrd" name="pswrd" type="password" required minlength="5" maxlength="14" placeholder="p@s$W0rD!!" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]{8,}$">
                    </div>
                    <div id="confirmPswrdDiv">
                        <label for="pswrd">CONFIRM PASSWORD:*</label>
                        <input id="pswrd" name="pswrd" type="password" required minlength="5" maxlength="14" placeholder="p@s$W0rD!!" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]{8,}$">
                    </div>
                </form>
            </div>
        </article>
        <article id="accCreationArticle">
            <div><button id="btnSubmit" type="submit">Create account</button></div>
            <span>Already have an account? <a href="">Log in</a></span>
        </article>
    </main>
</body>
</html>
