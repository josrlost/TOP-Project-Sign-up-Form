<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Project: Sign-up Form</title>
</head>
<body>
    <header>
        <section id="headerSection">
            <div>
                <h1></h1>
                <img id="logo">
            </div>
        </section>
    </header>
    <main>
        <section id="mainSection">
            <article id="introArticle">
                <button></button>
                <div>
                    <p>
                        This not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.
                    </p><br>
                    <p>You <em>know</em> you want to.</p>
                </div>
            </article>
            <article id="formArticle">
                <p>Let's do this!</p>
                <form>
                    <div class="formDiv">
                        <label for="fname">FIRST NAME</label>
                        <input id="fname" name="fname" type="text" required>
                    </div>
                    <div class="formDiv">
                        <label for="lname">LAST NAME</label>
                        <input id="lname" name="lname" type="text" required>
                    </div>
                    <div class="formDiv">
                        <label for="email">EMAIL</label>
                        <input id="email" name="email" type="email" required>
                    </div class="formDiv">
                    <div class="formDiv">
                        <label for="phone">PHONE NUMBER</label>
                        <input id="phone" name="phone" type="text" required>
                    </div>
                    <div class="formDiv">
                        <label for="pswrd">PASSWORD</label>
                        <input id="pswrd" name="pswrd" type="password" required>
                    </div>
                    <div class="formDiv">
                        <label for="pswrd">CONFIRM PASSWORD</label>
                        <input id="pswrd" name="pswrd" type="password" required>
                    </div>
                </form>
            </article>
            <article id="accCreationArticle">
                <button type="submit">Create account</button>
                <span>Already have an account? <a href="">Log in</a></span>
            </article>
        </section>
    </main>
</body>
</html>
